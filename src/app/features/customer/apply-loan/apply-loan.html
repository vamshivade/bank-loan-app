<div class="mx-auto max-w-4xl py-2 pb-12">
  <!-- Page Header -->
  <div class="mb-8">
    <h2 class="text-3xl font-bold tracking-tight text-slate-800">Apply for a Loan</h2>
    <p class="mt-2 text-slate-500">Please fill out the information below to securely submit your loan application.</p>
  </div>

  <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <!-- Progress Header -->
    <div class="border-b border-slate-100 bg-slate-50 px-8 py-5">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-slate-800">Application Form</h3>
        <span class="inline-flex items-center gap-1.5 rounded-full bg-blue-100 px-3 py-1 text-xs font-semibold text-blue-700">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          Secure SSL
        </span>
      </div>
    </div>

    <form class="p-8">
      
      <!-- SECTION 1: Personal Information -->
      <div class="mb-10">
        <h4 class="mb-5 flex items-center gap-2 text-lg font-bold text-slate-800">
          <span class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-100 text-xs text-blue-700">1</span>
          Personal Information
        </h4>
        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
          
          <div class="col-span-1">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Full Name</label>
            <input type="text" placeholder="John Doe" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
          </div>

          <div class="col-span-1">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">PAN Card</label>
            <input type="text" placeholder="ABCDE1234F" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm uppercase text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
          </div>

          <div class="col-span-1">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Date of Birth</label>
            <input type="date" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
          </div>

          <div class="col-span-1">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Email Address</label>
            <input type="email" placeholder="john@example.com" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
          </div>

          <div class="col-span-1 md:col-span-2">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Phone Number</label>
            <input type="tel" placeholder="+1 (555) 000-0000" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
          </div>

        </div>
      </div>

      <hr class="my-8 border-slate-100" />

      <!-- SECTION 2: Address Details -->
      <div class="mb-10">
        <h4 class="mb-5 flex items-center gap-2 text-lg font-bold text-slate-800">
          <span class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-100 text-xs text-blue-700">2</span>
          Address Details
        </h4>
        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
          
          <div class="col-span-1 md:col-span-2">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Street Address</label>
            <textarea rows="2" placeholder="123 Main St, Apt 4B" class="w-full resize-none rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"></textarea>
          </div>

          <div class="col-span-1">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">City</label>
            <input type="text" placeholder="New York" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
          </div>

          <div class="col-span-1">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">State</label>
            <select class="w-full appearance-none rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
              <option value="" disabled selected>Select a State</option>
              <option value="NY">New York</option>
              <option value="CA">California</option>
              <option value="TX">Texas</option>
              <option value="FL">Florida</option>
            </select>
          </div>

          <div class="col-span-1 md:col-span-2">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">ZIP Code</label>
            <input type="text" placeholder="10001" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
          </div>

        </div>
      </div>

      <hr class="my-8 border-slate-100" />

      <!-- SECTION 3: Financial Information -->
      <div class="mb-10">
        <h4 class="mb-5 flex items-center gap-2 text-lg font-bold text-slate-800">
          <span class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-100 text-xs text-blue-700">3</span>
          Financial Information
        </h4>
        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
          
          <div class="col-span-1">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Annual Income ($)</label>
            <input type="number" placeholder="85000" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
          </div>

          <div class="col-span-1">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Employment Status</label>
            <select class="w-full appearance-none rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
              <option value="" disabled selected>Select Status</option>
              <option value="full-time">Full-Time Employed</option>
              <option value="part-time">Part-Time Employed</option>
              <option value="self-employed">Self-Employed</option>
              <option value="unemployed">Unemployed</option>
            </select>
          </div>

          <div class="col-span-1">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Estimated Credit Score</label>
            <input type="number" placeholder="720" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
          </div>

          <div class="col-span-1">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Application Status</label>
            <select class="w-full appearance-none rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
              <option value="draft" selected>Draft</option>
              <option value="submitted">Submitted</option>
            </select>
          </div>

          <div class="col-span-1 md:col-span-2">
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Assets (Optional)</label>
            <textarea rows="3" placeholder="List any major assets (Real Estate, Vehicles, Investments)..." class="w-full resize-none rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm text-slate-900 transition-colors focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"></textarea>
          </div>

        </div>
      </div>

      <!-- Action Buttons -->
      <div class="mt-8 flex items-center justify-end gap-4 border-t border-slate-100 pt-8">
        <button type="button" class="rounded-xl px-5 py-2.5 text-sm font-semibold text-slate-600 transition-colors hover:bg-slate-100">
          Cancel
        </button>
        <button type="button" class="rounded-xl bg-blue-600 px-8 py-2.5 text-sm font-bold text-white shadow-lg shadow-blue-600/30 transition-all hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
          Submit Application
        </button>
      </div>

    </form>
  </div>
</div>
