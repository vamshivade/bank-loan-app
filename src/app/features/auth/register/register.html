<div
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#050505] px-4 py-5 text-white sm:px-6"
>
  <!-- ================= BACKGROUND ================= -->

  <div class="pointer-events-none absolute inset-0 overflow-hidden">

    <!-- Top-left glow -->
    <div
      class="absolute -left-32 -top-32 h-80 w-80 rounded-full bg-emerald-500/10 blur-[100px]"
    ></div>

    <!-- Bottom-right glow -->
    <div
      class="absolute -bottom-32 -right-32 h-80 w-80 rounded-full bg-cyan-500/10 blur-[100px]"
    ></div>

    <!-- Center glow -->
    <div
      class="absolute left-1/2 top-1/2 h-72 w-72 -translate-x-1/2 -translate-y-1/2 rounded-full bg-emerald-500/[0.03] blur-[100px]"
    ></div>

  </div>

  <!-- ================= MAIN ================= -->

  <div class="relative z-10 w-full max-w-[720px]">

    <!-- ================= CARD ================= -->

    <div
      class="rounded-2xl border border-white/10 bg-white/[0.055] px-5 py-5 shadow-2xl shadow-black/50 backdrop-blur-2xl sm:px-7 sm:py-6"
    >

      <!-- ================= TOP NAVIGATION ================= -->

      <div class="mb-6 flex items-center justify-between">

        <!-- Home -->

        <a
          routerLink="/"
          class="group inline-flex items-center gap-2 rounded-lg border border-white/[0.07] bg-white/[0.025] px-3 py-2 text-xs font-medium text-gray-400 transition duration-200 hover:border-emerald-400/20 hover:bg-emerald-400/[0.05] hover:text-white"
        >
          <span
            class="text-sm transition-transform duration-200 group-hover:-translate-x-0.5"
          >
            ←
          </span>

          Home
        </a>

        <!-- Login -->

        <div class="flex items-center gap-2 text-xs">

          <span class="text-gray-600">
            Already have an account?
          </span>

          <a
            routerLink="/login"
            class="font-medium text-emerald-400 transition hover:text-emerald-300"
          >
            Sign in
          </a>

        </div>

      </div>

      <!-- ================= HEADER ================= -->

      <div class="mb-6">

        <p
          class="mb-1 text-[10px] font-semibold uppercase tracking-[0.2em] text-emerald-400"
        >
          Create account
        </p>

        <div
          class="flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between"
        >

          <h1
            class="text-2xl font-semibold tracking-tight sm:text-[27px]"
          >
            Open your CapitalAxis account
          </h1>

          <p class="text-xs text-gray-500">
            It's quick and secure.
          </p>

        </div>

      </div>

      <!-- ================= FORM ================= -->

      <form class="space-y-4">

        <!-- Username + Full Name -->

        <div class="grid gap-4 sm:grid-cols-2">

          <!-- Username -->

          <div>

            <label
              for="username"
              class="mb-1.5 block text-xs font-medium text-gray-300"
            >
              Username
            </label>

            <input
              id="username"
              type="text"
              placeholder="Choose username"
              autocomplete="username"
              class="h-11 w-full rounded-lg border border-white/10 bg-black/30 px-3.5 text-sm text-white outline-none transition duration-200 placeholder:text-gray-600 focus:border-emerald-400/50 focus:bg-black/40 focus:ring-2 focus:ring-emerald-400/10"
            />

          </div>

          <!-- Full Name -->

          <div>

            <label
              for="fullName"
              class="mb-1.5 block text-xs font-medium text-gray-300"
            >
              Full Name
            </label>

            <input
              id="fullName"
              type="text"
              placeholder="Enter full name"
              autocomplete="name"
              class="h-11 w-full rounded-lg border border-white/10 bg-black/30 px-3.5 text-sm text-white outline-none transition duration-200 placeholder:text-gray-600 focus:border-emerald-400/50 focus:bg-black/40 focus:ring-2 focus:ring-emerald-400/10"
            />

          </div>

        </div>

        <!-- Email -->

        <div>

          <label
            for="email"
            class="mb-1.5 block text-xs font-medium text-gray-300"
          >
            Email Address
          </label>

          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            class="h-11 w-full rounded-lg border border-white/10 bg-black/30 px-3.5 text-sm text-white outline-none transition duration-200 placeholder:text-gray-600 focus:border-emerald-400/50 focus:bg-black/40 focus:ring-2 focus:ring-emerald-400/10"
          />

        </div>

        <!-- Password + Confirm -->

        <div class="grid gap-4 sm:grid-cols-2">

          <!-- Password -->

          <div>

            <label
              for="password"
              class="mb-1.5 block text-xs font-medium text-gray-300"
            >
              Password
            </label>

            <input
              id="password"
              type="password"
              placeholder="Create password"
              autocomplete="new-password"
              class="h-11 w-full rounded-lg border border-white/10 bg-black/30 px-3.5 text-sm text-white outline-none transition duration-200 placeholder:text-gray-600 focus:border-emerald-400/50 focus:bg-black/40 focus:ring-2 focus:ring-emerald-400/10"
            />

          </div>

          <!-- Confirm Password -->

          <div>

            <label
              for="confirmPassword"
              class="mb-1.5 block text-xs font-medium text-gray-300"
            >
              Confirm Password
            </label>

            <input
              id="confirmPassword"
              type="password"
              placeholder="Confirm password"
              autocomplete="new-password"
              class="h-11 w-full rounded-lg border border-white/10 bg-black/30 px-3.5 text-sm text-white outline-none transition duration-200 placeholder:text-gray-600 focus:border-emerald-400/50 focus:bg-black/40 focus:ring-2 focus:ring-emerald-400/10"
            />

          </div>

        </div>

        <!-- Terms -->

        <div class="flex items-start gap-2.5 pt-1">

          <input
            id="terms"
            type="checkbox"
            class="mt-0.5 h-3.5 w-3.5 cursor-pointer rounded border-white/20 bg-black/30 accent-emerald-400"
          />

          <label
            for="terms"
            class="cursor-pointer text-[11px] leading-4 text-gray-500"
          >
            I agree to the

            <a
              routerLink="/terms"
              class="text-gray-300 transition hover:text-white"
            >
              Terms & Conditions
            </a>

            and

            <a
              routerLink="/privacy"
              class="text-gray-300 transition hover:text-white"
            >
              Privacy Policy
            </a>.
          </label>

        </div>

        <!-- Create Account -->

        <button
          type="submit"
          class="h-11 w-full rounded-lg bg-emerald-400 text-sm font-semibold text-black transition duration-200 hover:bg-emerald-300 active:scale-[0.99]"
        >
          Create Account
        </button>

      </form>

      <!-- ================= BOTTOM LOGIN ================= -->

      <div class="mt-5 flex items-center justify-center gap-1.5 text-center">

        <span class="text-xs text-gray-500">
          Already have an account?
        </span>

        <a
          routerLink="/login"
          class="text-xs font-medium text-emerald-400 transition hover:text-emerald-300"
        >
          Sign in
        </a>

      </div>

    </div>

    <!-- ================= FOOTER ================= -->

    <p class="mt-3 text-center text-[10px] text-gray-600">
      © 2026 CapitalAxis
      <span class="mx-1 text-gray-700">·</span>
      Secure digital banking
    </p>

  </div>

</div>
